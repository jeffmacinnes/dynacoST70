  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Overview: getting-started/overview.md
      - Tools and workspace: getting-started/tools-and-workspace.md
      - Reading this manual: getting-started/reading-this-manual.md
      - Safety basics: getting-started/safety-basics.md
  - Components:
      - components/index.md
      - PA-060 power transformer: components/pa-060-power-transformer.md
      - A-470 output transformer: components/a-470-output-transformer.md
      - 5AR4 rectifier tube: components/5ar4-rectifier-tube.md
      - EL34 output tube: components/el34-output-tube.md
      - 6GH8A driver tube: components/6gh8a-driver-tube.md
      - Filter capacitors: components/filter-capacitors.md
