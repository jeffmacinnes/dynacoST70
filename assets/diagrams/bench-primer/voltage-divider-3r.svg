<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" font-family="Inter, system-ui, sans-serif">
  <title>Three-resistor voltage divider</title>
  <desc>A 9 V source feeds three 10 kΩ resistors in series to ground, with two intermediate taps (V_a and V_b). Models the ST-70 bias chain.</desc>
  <style>
    .wire   { stroke: #1a1a1a; stroke-width: 2.2; fill: none; }
    .comp   { fill: #f4efe5; stroke: #1a1a1a; stroke-width: 2; }
    .gnd    { stroke: #1a1a1a; stroke-width: 2; fill: none; }
    .label  { font-size: 14px; fill: #1a1a1a; }
    .val    { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
    .ann    { font-size: 12px; font-style: italic; fill: #555; }
    .tap    { fill: #2a6cad; }
  </style>
  <rect width="480" height="420" fill="#ffffff"/>

  <!-- V_in -->
  <line class="wire" x1="240" y1="30" x2="240" y2="70"/>
  <circle class="tap" cx="240" cy="30" r="4"/>
  <text class="val" x="252" y="34">V_in = 9 V</text>

  <!-- R1 -->
  <rect class="comp" x="216" y="70" width="48" height="70" rx="3"/>
  <text class="val" x="280" y="110">R1 = 10 kΩ</text>

  <!-- Tap V_a -->
  <line class="wire" x1="240" y1="140" x2="240" y2="180"/>
  <line class="wire" x1="240" y1="160" x2="180" y2="160"/>
  <circle class="tap" cx="180" cy="160" r="4"/>
  <text class="val" x="172" y="156" text-anchor="end">V_a</text>
  <text class="val" x="172" y="172" text-anchor="end">= 6 V</text>

  <!-- R2 -->
  <rect class="comp" x="216" y="180" width="48" height="70" rx="3"/>
  <text class="val" x="280" y="220">R2 = 10 kΩ</text>

  <!-- Tap V_b -->
  <line class="wire" x1="240" y1="250" x2="240" y2="290"/>
  <line class="wire" x1="240" y1="270" x2="180" y2="270"/>
  <circle class="tap" cx="180" cy="270" r="4"/>
  <text class="val" x="172" y="266" text-anchor="end">V_b</text>
  <text class="val" x="172" y="282" text-anchor="end">= 3 V</text>

  <!-- R3 -->
  <rect class="comp" x="216" y="290" width="48" height="70" rx="3"/>
  <text class="val" x="280" y="330">R3 = 10 kΩ</text>

  <!-- Ground -->
  <line class="wire" x1="240" y1="360" x2="240" y2="385"/>
  <g transform="translate(240, 385)">
    <line class="gnd" x1="-16" y1="0"  x2="16" y2="0" stroke-width="2.4"/>
    <line class="gnd" x1="-11" y1="6"  x2="11" y2="6"/>
    <line class="gnd" x1="-6"  y1="12" x2="6"  y2="12"/>
    <text class="label" x="22" y="6">GND</text>
  </g>

  <!-- Current annotation (bottom — out of the way of R1/R2/R3 labels) -->
  <text class="ann" x="240" y="408" text-anchor="middle">I = 9 V / 30 kΩ = 0.3 mA (same current through all three resistors)</text>
</svg>
