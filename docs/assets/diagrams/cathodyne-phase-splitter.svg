<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 760"
     role="img"
     aria-labelledby="ph-title ph-desc"
     font-family="Inter, system-ui, sans-serif">
  <title id="ph-title">Cathodyne (split-load) phase splitter</title>
  <desc id="ph-desc">One triode produces two output signals 180° out of phase. Equal-value resistors on the plate and cathode mean both outputs have the same amplitude — perfect for driving a push-pull pair.</desc>

  <style>
    .lead-group { cursor: help; }
    .lead-group:hover .interactive { stroke-width: 2.5; }

    .header  { font-size: 21px; font-weight: 700; fill: #1a1a1a; }
    .subhead { font-size: 12px; fill: #444; }
    .footer  { font-size: 11px; font-style: italic; fill: #555; }

    .section-label { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
    .label         { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
    .sub           { font-size: 11px; fill: #444; }

    .wire        { stroke: #555; stroke-width: 2; fill: none; }
    .wire-hot    { stroke: #cc3a2a; stroke-width: 2.5; fill: none; }
    .wire-cold   { stroke: #1a4e8a; stroke-width: 2.5; fill: none; }
    .wire-bplus  { stroke: #b8851a; stroke-width: 2.5; fill: none; }

    .tube-envelope { fill: #eef3fb; stroke: #1a1a1a; stroke-width: 1.6; opacity: 0.6; }
    .resistor   { fill: #f4f4f4; stroke: #1a1a1a; stroke-width: 1.5; }
    .signal     { stroke-width: 2.2; fill: none; }
    .node-dot   { fill: #1a1a1a; }
  </style>

  <rect width="1200" height="760" fill="#ffffff"/>

  <!-- ============ TITLE ============ -->
  <text class="header"  x="600" y="36" text-anchor="middle">Cathodyne (split-load) phase splitter</text>
  <text class="subhead" x="600" y="58" text-anchor="middle">One triode, equal resistors top and bottom, two outputs that are exact mirror images. The classic balanced splitter.</text>

  <!-- ============ SCHEMATIC (LEFT SIDE) ============ -->

  <!-- B+ rail at top -->
  <line class="wire-bplus" x1="400" y1="120" x2="500" y2="120"/>
  <text class="label" x="380" y="125" text-anchor="end" fill="#b8851a">B+</text>

  <!-- Plate load resistor (R_plate) -->
  <g class="lead-group">
    <title>PLATE LOAD RESISTOR (R_plate).

Same value as the cathode resistor below — typically ~22 kΩ for a 6GH8A in this role. When the tube conducts harder, more current flows through this resistor, dropping more voltage across it. That makes the plate go DOWN — the inverted (anti-phase) output.</title>
    <line class="wire" x1="450" y1="120" x2="450" y2="160"/>
    <rect class="resistor interactive" x="430" y="160" width="40" height="80" rx="3"/>
    <text class="label" x="490" y="195">R_plate</text>
    <text class="sub"   x="490" y="211">~22 kΩ</text>
    <line class="wire" x1="450" y1="240" x2="450" y2="290"/>
  </g>

  <!-- Plate output tap -->
  <circle class="node-dot" cx="450" cy="290" r="4"/>
  <line class="wire-cold" x1="450" y1="290" x2="700" y2="290"/>
  <polygon points="700,286 710,290 700,294" fill="#1a4e8a"/>

  <!-- Triode envelope -->
  <g class="lead-group">
    <title>TRIODE (one half of the 6GH8A in the ST-70).

A single tube with three working elements:
• Plate (top) — collects electrons, output side of the tube.
• Grid (middle) — receives the input audio signal.
• Cathode (bottom) — heated source of electrons.

Current flows from cathode → grid → plate, controlled by the grid voltage. When the grid swings positive, more current flows. When negative, less.</title>
    <circle class="tube-envelope interactive" cx="450" cy="380" r="80"/>
    <!-- Inside: plate (top horizontal line) -->
    <line x1="430" y1="335" x2="470" y2="335" stroke="#1a1a1a" stroke-width="2"/>
    <text class="sub" x="450" y="332" text-anchor="middle" fill="#1a1a1a">P</text>
    <!-- Inside: grid (middle dashed line) -->
    <line x1="425" y1="380" x2="445" y2="380" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="2 2"/>
    <line x1="455" y1="380" x2="475" y2="380" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text class="sub" x="450" y="375" text-anchor="middle" fill="#1a1a1a">G</text>
    <!-- Inside: cathode (bottom horizontal line) -->
    <line x1="430" y1="425" x2="470" y2="425" stroke="#1a1a1a" stroke-width="2"/>
    <text class="sub" x="450" y="448" text-anchor="middle" fill="#1a1a1a">K</text>
  </g>

  <!-- Wire from plate down to plate tap (already at 290) - actually wire is from plate
       at y=335 up to y=290 -->
  <line class="wire" x1="450" y1="290" x2="450" y2="335"/>

  <!-- Wire from cathode to cathode tap -->
  <line class="wire" x1="450" y1="425" x2="450" y2="470"/>

  <!-- Cathode output tap -->
  <circle class="node-dot" cx="450" cy="470" r="4"/>
  <line class="wire-hot" x1="450" y1="470" x2="700" y2="470"/>
  <polygon points="700,466 710,470 700,474" fill="#cc3a2a"/>

  <!-- Cathode resistor (R_cathode) -->
  <g class="lead-group">
    <title>CATHODE RESISTOR (R_cathode).

EQUAL VALUE to the plate resistor — that's what makes this circuit "balanced." When the tube conducts harder, more current flows through this resistor too, dropping more voltage across it. The cathode is on the TOP of this resistor (ground is on the bottom), so when more voltage drops across it the cathode rises UP — the non-inverted (in-phase) output.

Because the SAME current flows through both R_plate and R_cathode, and they're EQUAL value, the voltage swings at the plate and cathode are EQUAL in magnitude (just opposite in sign). That's the magic of cathodyne: perfectly balanced outputs.</title>
    <line class="wire" x1="450" y1="470" x2="450" y2="510"/>
    <rect class="resistor interactive" x="430" y="510" width="40" height="80" rx="3"/>
    <text class="label" x="490" y="545">R_cathode</text>
    <text class="sub"   x="490" y="561">~22 kΩ · same value</text>
    <line class="wire" x1="450" y1="590" x2="450" y2="640"/>
  </g>

  <!-- Ground at the bottom -->
  <g transform="translate(450, 640)">
    <line class="wire" x1="-15" y1="0"  x2="15" y2="0"/>
    <line class="wire" x1="-10" y1="6"  x2="10" y2="6"/>
    <line class="wire" x1="-5"  y1="12" x2="5"  y2="12"/>
  </g>
  <text class="sub" x="475" y="650" fill="#555">GND</text>

  <!-- Input (audio signal) — from the left, into the grid -->
  <g class="lead-group">
    <title>INPUT (audio signal from the previous amplifier stage).

In the ST-70's PC-3A board, the input here comes from the pentode section of the 6GH8A — the same physical tube envelope contains both the voltage amplifier (pentode) and this phase splitter (triode).</title>
    <line class="wire interactive" x1="120" y1="380" x2="370" y2="380"/>
    <polygon points="370,376 380,380 370,384" fill="#555"/>
    <text class="label" x="120" y="368">input</text>
    <text class="sub"   x="120" y="396">(from pentode stage)</text>
    <path class="signal" stroke="#1a1a1a"
          d="M 80 410 Q 95 390 110 410 T 140 410"/>
  </g>

  <!-- ============ OUTPUT LABELS ============ -->
  <!-- Plate output (anti-phase) -->
  <g class="lead-group">
    <title>OUTPUT A: PLATE (anti-phase / inverted).

When the input swings positive, this output swings NEGATIVE. Drives one tube of the push-pull pair (typically V2 / V6 in the ST-70).

Why anti-phase: when the grid goes positive, the tube conducts harder → more voltage dropped across R_plate → plate voltage falls. So input ↑ produces plate ↓.</title>
    <text class="label" x="720" y="285" fill="#1a4e8a">Output A · anti-phase</text>
    <text class="sub"   x="720" y="303">→ to V2/V6 grid (one EL34)</text>
    <!-- Small waveform -->
    <path class="signal" stroke="#1a4e8a"
          d="M 720 318 Q 735 338 750 318 T 780 318"/>
  </g>

  <!-- Cathode output (in-phase) -->
  <g class="lead-group">
    <title>OUTPUT B: CATHODE (in-phase / non-inverted).

When the input swings positive, this output ALSO swings positive — same direction as the input. Drives the OTHER tube of the push-pull pair (V3 / V7).

Why in-phase: when the grid goes positive, the tube conducts harder → more current flows down through R_cathode → cathode rises. So input ↑ produces cathode ↑.

Equal-magnitude swings (because same current × same resistance), opposite signs to the plate output. Perfect for push-pull.</title>
    <text class="label" x="720" y="465" fill="#cc3a2a">Output B · in-phase</text>
    <text class="sub"   x="720" y="483">→ to V3/V7 grid (other EL34)</text>
    <!-- Small waveform -->
    <path class="signal" stroke="#cc3a2a"
          d="M 720 498 Q 735 478 750 498 T 780 498"/>
  </g>

  <!-- ============ KEY INSIGHT BOX (RIGHT SIDE) ============ -->
  <g transform="translate(900, 200)">
    <rect x="0" y="0" width="270" height="380" rx="4" fill="#f4f4f4" stroke="#aaa" stroke-width="1"/>
    <text class="section-label" x="135" y="28" text-anchor="middle">Why it's balanced</text>

    <text class="sub" x="14" y="60">The SAME current flows through:</text>
    <text class="sub" x="14" y="78">• R_plate (above the tube)</text>
    <text class="sub" x="14" y="94">• the tube itself</text>
    <text class="sub" x="14" y="110">• R_cathode (below the tube)</text>

    <text class="sub" x="14" y="142">If R_plate = R_cathode (and they ARE,</text>
    <text class="sub" x="14" y="158">deliberately chosen equal), then the</text>
    <text class="sub" x="14" y="174">voltage drops are EQUAL in magnitude.</text>

    <text class="sub" x="14" y="206">→ Plate swings <tspan font-weight="700">−ΔV</tspan></text>
    <text class="sub" x="14" y="222">→ Cathode swings <tspan font-weight="700">+ΔV</tspan></text>
    <text class="sub" x="14" y="238">Exactly opposite. Exactly equal.</text>

    <text class="sub" x="14" y="270" font-style="italic">No matching of components needed,</text>
    <text class="sub" x="14" y="286" font-style="italic">no trimpot, no calibration — physics</text>
    <text class="sub" x="14" y="302" font-style="italic">does the balancing automatically.</text>

    <text class="sub" x="14" y="334" fill="#cc3a2a">Caveat: the output impedance differs</text>
    <text class="sub" x="14" y="350" fill="#cc3a2a">between the two outputs. Modern designs</text>
    <text class="sub" x="14" y="366" fill="#cc3a2a">often prefer long-tail-pair instead.</text>
  </g>

  <!-- ============ FOOTER ============ -->
  <text class="footer" x="600" y="710" text-anchor="middle">The original ST-70 driver board uses this topology with one triode section of the 6GH8A.</text>
  <text class="footer" x="600" y="730" text-anchor="middle">The VTA upgrade replaces it with a long-tail-pair design — better output drive but more parts.</text>
</svg>
