<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="Inter, system-ui, sans-serif">
  <title>Leaky capacitor model — ideal cap in parallel with leakage resistance</title>
  <desc>An electrolytic capacitor modeled as an ideal capacitor in parallel with an internal leakage resistance R_leak. Larger R_leak means a healthier cap.</desc>
  <style>
    .wire   { stroke: #1a1a1a; stroke-width: 2.2; fill: none; }
    .comp   { fill: #f4efe5; stroke: #1a1a1a; stroke-width: 2; }
    .capln  { stroke: #1a1a1a; stroke-width: 3; fill: none; }
    .pkg    { fill: none; stroke: #999; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .label  { font-size: 14px; fill: #1a1a1a; }
    .val    { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
    .ann    { font-size: 12px; font-style: italic; fill: #555; }
  </style>
  <rect width="480" height="320" fill="#ffffff"/>

  <text class="val" x="240" y="30" text-anchor="middle">Real electrolytic cap — equivalent model</text>

  <!-- Dashed package boundary -->
  <rect class="pkg" x="120" y="60" width="240" height="200" rx="8"/>
  <text class="ann" x="358" y="78" text-anchor="end">(the cap as a single part)</text>

  <!-- Top terminal -->
  <line class="wire" x1="240" y1="60" x2="240" y2="80"/>
  <text class="val" x="244" y="50">+</text>

  <!-- Junction -->
  <line class="wire" x1="180" y1="80" x2="300" y2="80"/>
  <circle cx="180" cy="80" r="3" fill="#1a1a1a"/>
  <circle cx="300" cy="80" r="3" fill="#1a1a1a"/>

  <!-- Ideal cap (left branch) -->
  <line class="wire" x1="180" y1="80" x2="180" y2="160"/>
  <line class="capln" x1="158" y1="160" x2="202" y2="160"/>
  <line class="capln" x1="158" y1="172" x2="202" y2="172"/>
  <line class="wire" x1="180" y1="172" x2="180" y2="240"/>
  <text class="val" x="118" y="170" text-anchor="end">ideal C</text>

  <!-- R_leak (right branch) -->
  <line class="wire" x1="300" y1="80" x2="300" y2="130"/>
  <rect class="comp" x="276" y="130" width="48" height="70" rx="3"/>
  <line class="wire" x1="300" y1="200" x2="300" y2="240"/>
  <text class="val" x="362" y="160">R_leak</text>
  <text class="ann" x="362" y="178">(huge for healthy cap;</text>
  <text class="ann" x="362" y="192">smaller for leaky one)</text>

  <!-- Bottom junction -->
  <line class="wire" x1="180" y1="240" x2="300" y2="240"/>
  <circle cx="180" cy="240" r="3" fill="#1a1a1a"/>
  <circle cx="300" cy="240" r="3" fill="#1a1a1a"/>
  <line class="wire" x1="240" y1="240" x2="240" y2="260"/>
  <text class="val" x="244" y="278">−</text>

  <text class="ann" x="240" y="298" text-anchor="middle">Leakage current at voltage V: I_leak = V / R_leak</text>
</svg>
