<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="Inter, system-ui, sans-serif">
  <title>RC charging curve — exponential approach to V_supply</title>
  <desc>Plot of V(t) for a capacitor charging through a resistor, showing the 63% / 86% / 95% / 99% markers at 1τ, 2τ, 3τ, 5τ.</desc>
  <style>
    .axis   { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .grid   { stroke: #d0d0d0; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .curve  { stroke: #2a6cad; stroke-width: 2.6; fill: none; }
    .marker { fill: #c0392b; }
    .label  { font-size: 13px; fill: #1a1a1a; }
    .val    { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
    .ann    { font-size: 12px; font-style: italic; fill: #555; }
    .vsup   { stroke: #888; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
  </style>
  <rect width="520" height="340" fill="#ffffff"/>

  <text class="val" x="260" y="24" text-anchor="middle">V(t) = V_supply × (1 − e^(−t/τ))</text>

  <!-- Axes -->
  <line class="axis" x1="60" y1="280" x2="480" y2="280"/>
  <line class="axis" x1="60" y1="280" x2="60" y2="60"/>
  <polygon points="480,280 472,276 472,284" fill="#1a1a1a"/>
  <polygon points="60,60 56,68 64,68" fill="#1a1a1a"/>

  <!-- V_supply asymptote -->
  <line class="vsup" x1="60" y1="80" x2="480" y2="80"/>
  <text class="ann" x="476" y="74" text-anchor="end">V_supply (asymptote)</text>

  <!-- Grid lines at τ markers (τ = 80 px) -->
  <line class="grid" x1="140" y1="280" x2="140" y2="80"/>
  <line class="grid" x1="220" y1="280" x2="220" y2="80"/>
  <line class="grid" x1="300" y1="280" x2="300" y2="80"/>
  <line class="grid" x1="380" y1="280" x2="380" y2="80"/>

  <!-- Charging curve: V(t) = 200(1 - e^(-t/80)), from x=60 to x=460. y=280-V -->
  <!-- Sample at x={60,80,100,120,...,460} -->
  <path class="curve" d="
    M 60 280
    Q 100 230 140 206
    Q 180 184 220 168
    Q 260 154 300 142
    Q 340 132 380 124
    Q 420 116 480 105
  "/>

  <!-- Markers at 1τ, 2τ, 3τ, 5τ -->
  <circle class="marker" cx="140" cy="206" r="4"/>
  <circle class="marker" cx="220" cy="166" r="4"/>
  <circle class="marker" cx="300" cy="120" r="4"/>
  <circle class="marker" cx="460" cy="82"  r="4"/>

  <text class="val" x="140" y="298" text-anchor="middle">1τ</text>
  <text class="val" x="220" y="298" text-anchor="middle">2τ</text>
  <text class="val" x="300" y="298" text-anchor="middle">3τ</text>
  <text class="val" x="460" y="298" text-anchor="middle">5τ</text>

  <text class="ann" x="140" y="200" text-anchor="middle" fill="#c0392b">63%</text>
  <text class="ann" x="220" y="160" text-anchor="middle" fill="#c0392b">86%</text>
  <text class="ann" x="300" y="114" text-anchor="middle" fill="#c0392b">95%</text>
  <text class="ann" x="460" y="76" text-anchor="end" fill="#c0392b">99%</text>

  <text class="label" x="40" y="282" text-anchor="end">0</text>
  <text class="label" x="40" y="84"  text-anchor="end">V_sup</text>

  <text class="ann" x="260" y="324" text-anchor="middle">time (multiples of the time constant τ = R × C)</text>
</svg>
