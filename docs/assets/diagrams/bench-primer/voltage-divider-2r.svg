<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="Inter, system-ui, sans-serif">
  <title>Two-resistor voltage divider</title>
  <desc>A 9 V source feeds two resistors (R1 on top, R2 on bottom) in series to ground. The midpoint between them is tapped off as V_mid.</desc>
  <style>
    .wire   { stroke: #1a1a1a; stroke-width: 2.2; fill: none; }
    .comp   { fill: #f4efe5; stroke: #1a1a1a; stroke-width: 2; }
    .gnd    { stroke: #1a1a1a; stroke-width: 2; fill: none; }
    .label  { font-size: 14px; fill: #1a1a1a; }
    .val    { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
    .ann    { font-size: 12px; font-style: italic; fill: #555; }
    .tap    { fill: #2a6cad; }
  </style>
  <rect width="480" height="340" fill="#ffffff"/>

  <!-- V_in label and top terminal -->
  <line class="wire" x1="240" y1="30" x2="240" y2="80"/>
  <circle class="tap" cx="240" cy="30" r="4"/>
  <text class="val" x="252" y="34">V_in = 9 V</text>

  <!-- R1 -->
  <rect class="comp" x="216" y="80" width="48" height="70" rx="3"/>
  <text class="val" x="280" y="110">R1</text>
  <text class="val" x="280" y="130">1 kΩ</text>
  <text class="ann" x="200" y="115" text-anchor="end">drops 3 V</text>

  <!-- Midpoint tap -->
  <line class="wire" x1="240" y1="150" x2="240" y2="190"/>
  <line class="wire" x1="240" y1="170" x2="180" y2="170"/>
  <circle class="tap" cx="180" cy="170" r="4"/>
  <text class="val" x="172" y="166" text-anchor="end">V_mid</text>
  <text class="val" x="172" y="182" text-anchor="end">= 6 V</text>

  <!-- R2 -->
  <rect class="comp" x="216" y="190" width="48" height="70" rx="3"/>
  <text class="val" x="280" y="220">R2</text>
  <text class="val" x="280" y="240">2 kΩ</text>
  <text class="ann" x="200" y="225" text-anchor="end">drops 6 V</text>

  <!-- Bottom wire and ground -->
  <line class="wire" x1="240" y1="260" x2="240" y2="290"/>
  <g transform="translate(240, 290)">
    <line class="gnd" x1="-16" y1="0"  x2="16" y2="0" stroke-width="2.4"/>
    <line class="gnd" x1="-11" y1="6"  x2="11" y2="6"/>
    <line class="gnd" x1="-6"  y1="12" x2="6"  y2="12"/>
    <text class="label" x="22" y="6">GND (0 V)</text>
  </g>

  <!-- Equation box (right side) -->
  <g transform="translate(360, 110)">
    <text class="ann" x="0" y="0">V_mid = V_in × R2 / (R1+R2)</text>
    <text class="ann" x="0" y="18">     = 9 × 2/3 = 6 V</text>
  </g>
</svg>
