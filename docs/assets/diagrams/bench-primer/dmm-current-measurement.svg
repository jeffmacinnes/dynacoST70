<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="Inter, system-ui, sans-serif">
  <title>DMM in current mode — in series with the load</title>
  <desc>9 V battery, DMM in series in current (mA) mode, then a 1 kΩ resistor and return to ground.</desc>
  <style>
    .wire   { stroke: #1a1a1a; stroke-width: 2.2; fill: none; }
    .comp   { fill: #f4efe5; stroke: #1a1a1a; stroke-width: 2; }
    .dmm    { fill: #eef4ec; stroke: #2a6cad; stroke-width: 2; }
    .gnd    { stroke: #1a1a1a; stroke-width: 2; fill: none; }
    .label  { font-size: 14px; fill: #1a1a1a; }
    .val    { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
    .ann    { font-size: 12px; font-style: italic; fill: #555; }
    .dmm-lbl { font-size: 13px; fill: #2a6cad; font-weight: 700; }
  </style>
  <rect width="480" height="320" fill="#ffffff"/>

  <!-- Battery -->
  <g transform="translate(60, 100)">
    <line class="wire" x1="-22" y1="0"  x2="22" y2="0" stroke-width="3"/>
    <line class="wire" x1="-14" y1="14" x2="14" y2="14" stroke-width="3"/>
    <text class="val" x="38" y="4">9 V</text>
    <text class="label" x="-30" y="4" text-anchor="end">+</text>
    <text class="label" x="-30" y="18" text-anchor="end">−</text>
  </g>

  <!-- Top wire to DMM -->
  <line class="wire" x1="60"  y1="100" x2="60"  y2="60"/>
  <line class="wire" x1="60"  y1="60"  x2="180" y2="60"/>

  <!-- DMM in series -->
  <rect class="dmm" x="180" y="40" width="120" height="60" rx="6"/>
  <text class="dmm-lbl" x="240" y="62" text-anchor="middle">DMM (mA)</text>
  <text class="ann" x="240" y="80" text-anchor="middle">in series</text>
  <text class="ann" x="240" y="94" text-anchor="middle">reads I directly</text>

  <line class="wire" x1="300" y1="60" x2="380" y2="60"/>

  <!-- Resistor -->
  <line class="wire" x1="380" y1="60" x2="380" y2="110"/>
  <rect class="comp" x="356" y="110" width="48" height="70" rx="3"/>
  <text class="val" x="416" y="150">R = 1 kΩ</text>

  <!-- Bottom return -->
  <line class="wire" x1="380" y1="180" x2="380" y2="230"/>
  <line class="wire" x1="380" y1="230" x2="60"  y2="230"/>
  <line class="wire" x1="60"  y1="230" x2="60"  y2="114"/>

  <!-- Ground -->
  <g transform="translate(220, 230)">
    <line class="wire" x1="0" y1="0"   x2="0" y2="20"/>
    <line class="gnd"  x1="-16" y1="20" x2="16" y2="20" stroke-width="2.4"/>
    <line class="gnd"  x1="-11" y1="26" x2="11" y2="26"/>
    <line class="gnd"  x1="-6"  y1="32" x2="6"  y2="32"/>
    <text class="label" x="22" y="26">GND (battery −)</text>
  </g>

  <text class="ann" x="240" y="290" text-anchor="middle">Predicted: I = 9 V / 1 kΩ = 9 mA</text>
</svg>
