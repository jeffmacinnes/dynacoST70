<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, system-ui, sans-serif">
  <title>RC discharge curve — exponential decay</title>
  <desc>Plot of V(t) for a charged capacitor discharging through a resistor, showing the 37% / 14% / 5% / ~1% markers at 1τ, 2τ, 3τ, 5τ.</desc>
  <style>
    .axis   { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    .grid   { stroke: #d0d0d0; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .curve  { stroke: #c0392b; stroke-width: 2.6; fill: none; stroke-linejoin: round; }
    .marker { fill: #2a6cad; }
    .label  { font-size: 13px; fill: #1a1a1a; }
    .val    { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
    .ann    { font-size: 12px; font-style: italic; fill: #555; }
    .vsup   { stroke: #888; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
  </style>
  <rect width="560" height="360" fill="#ffffff"/>

  <text class="val" x="280" y="26" text-anchor="middle">V(t) = V_initial × e^(−t/τ)</text>

  <!-- Axes — same geometry as the charging plot. -->
  <line class="axis" x1="80" y1="290" x2="510" y2="290"/>
  <line class="axis" x1="80" y1="290" x2="80" y2="60"/>
  <polygon points="510,290 502,286 502,294" fill="#1a1a1a"/>
  <polygon points="80,60 76,68 84,68" fill="#1a1a1a"/>

  <line class="vsup" x1="80" y1="80" x2="510" y2="80"/>
  <text class="ann" x="506" y="72" text-anchor="end">V_initial</text>

  <line class="grid" x1="160" y1="290" x2="160" y2="80"/>
  <line class="grid" x1="240" y1="290" x2="240" y2="80"/>
  <line class="grid" x1="320" y1="290" x2="320" y2="80"/>
  <line class="grid" x1="480" y1="290" x2="480" y2="80"/>

  <!-- Discharge curve: V(t) = V_init × e^(−t/τ).
       y = 290 − 210 × e^(−(x−80)/80). -->
  <path class="curve" d="
    M 80   80
    L 90  105
    L 100 127
    L 110 146
    L 120 163
    L 140 191
    L 160 213
    L 180 230
    L 200 243
    L 220 254
    L 240 262
    L 280 273
    L 320 280
    L 360 284
    L 400 286
    L 480 289
    L 510 289
  "/>

  <!-- Markers at 1τ (37%), 2τ (14%), 3τ (5%), 5τ (~1%) -->
  <circle class="marker" cx="160" cy="213" r="4.5"/>
  <circle class="marker" cx="240" cy="262" r="4.5"/>
  <circle class="marker" cx="320" cy="280" r="4.5"/>
  <circle class="marker" cx="480" cy="289" r="4.5"/>

  <text class="val" x="160" y="308" text-anchor="middle">1τ</text>
  <text class="val" x="240" y="308" text-anchor="middle">2τ</text>
  <text class="val" x="320" y="308" text-anchor="middle">3τ</text>
  <text class="val" x="480" y="308" text-anchor="middle">5τ</text>

  <!-- Percentage labels — above each marker (curve is falling, plenty of room above). -->
  <text class="ann" x="160" y="194" text-anchor="middle" fill="#2a6cad">37%</text>
  <text class="ann" x="240" y="250" text-anchor="middle" fill="#2a6cad">14%</text>
  <text class="ann" x="320" y="268" text-anchor="middle" fill="#2a6cad">5%</text>
  <text class="ann" x="480" y="277" text-anchor="middle" fill="#2a6cad">~1%</text>

  <text class="label" x="72" y="294" text-anchor="end">0</text>
  <text class="label" x="72" y="84"  text-anchor="end">V_i</text>

  <text class="ann" x="280" y="340" text-anchor="middle">time (in multiples of τ = R × C)</text>
</svg>
